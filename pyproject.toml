[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.1.0"
description = "Minimal tool-use agent in Python without frameworks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx",
]

[project.scripts]
agent = "agent.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

